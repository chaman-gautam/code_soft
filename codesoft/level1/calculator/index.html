<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>claculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="head">
            <div class="display-data">0</div>
        </div>
        <div class="buttons">
            <div class="button  clear_all">AC</div> 
            <div class="button number button_number">9</div>
            <div class="button number button_number">8</div>
            <div class="button number button_number">7</div>
            <div class="button  back_space"><=</div>
            <div class="button operator add button_number">+</div>
            <div class="button number button_number">6</div>
            <div class="button number button_number">5</div>
            <div class="button number button_number">4</div>
            <div class="button operator multi button_number">*</div>
            <div class="button operator sub">-</div>
            <div class="button number button_number">3</div>
            <div class="button number button_number">2</div>
            <div class="button number button_number">1</div>
            <div class="button operator divi button_number">/</div>
            <div class="button operator mode button_number">%</div>
            <div class="button point button_number">.</div>
            <div class="button number button_number">0</div>
            <div class="button a1  equal">=</div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
